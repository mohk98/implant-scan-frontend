<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ImplantScan</title>

<!-- js-aruco2 — ملفات محلية -->
<script src="aruco.js"></script>
<script src="posit1.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{
  --bg:#080c10;--surface:#0f1923;--border:#1a2a3a;
  --accent:#00d4ff;--green:#00e676;--yellow:#ffcc00;
  --text:#e0f0f8;--muted:#3d5a6e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',sans-serif;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .25s}
.screen.active{opacity:1;pointer-events:all}

#s-start{align-items:center;justify-content:center;padding:32px 24px;gap:18px}
.brand{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:4px;color:var(--muted)}
.hero{width:88px;height:88px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative}
.hero::before{content:'';position:absolute;inset:8px;border-radius:50%;border:1px solid var(--accent);opacity:.3}
#s-start h1{font-size:22px;font-weight:600;text-align:center}
#s-start p{font-size:13px;color:var(--muted);text-align:center;line-height:1.7;max-width:280px}
.count-row{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:280px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 18px}
.count-label{font-size:13px;color:var(--muted)}
.count-controls{display:flex;align-items:center;gap:16px}
.cnt-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cnt-btn:active{border-color:var(--accent)}
#cnt-val{font-family:'IBM Plex Mono',monospace;font-size:22px;color:var(--accent);min-width:20px;text-align:center}
.btn-main{width:100%;max-width:280px;padding:15px;border:none;border-radius:14px;background:var(--accent);color:#000;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:15px;font-weight:600;cursor:pointer}
.btn-main:active{opacity:.8}
.lib-status{font-size:11px;color:var(--muted);text-align:center}
.lib-status.ok{color:var(--green)}
.lib-status.err{color:#ff4444}

#s-scan{background:#000}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#overlay-canvas{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:none}
.hud-top{padding:14px 18px 10px;background:linear-gradient(#000b,transparent);display:flex;align-items:center;justify-content:space-between;pointer-events:all}
.hud-logo{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent);letter-spacing:2px}
.btn-cancel{background:rgba(255,255,255,.1);border:none;color:#fff;padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer}
.hud-bottom{padding:14px 18px 32px;background:linear-gradient(transparent,#000c);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:all}
.status-pill{display:flex;align-items:center;gap:8px;background:rgba(0,0,.65);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:8px 18px;font-size:13px;backdrop-filter:blur(8px);background:rgba(0,0,0,.65)}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--yellow);animation:blink 1s infinite;flex-shrink:0}
.sdot.found{background:var(--green);animation:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.imp-indicators{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.imp-circle{width:36px;height:36px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);transition:all .3s;background:rgba(0,0,0,.5)}
.imp-circle.found{border-color:var(--green);color:var(--green);background:rgba(0,230,118,.1)}
.analyze-btn{width:100%;max-width:280px;padding:14px;border:none;border-radius:14px;background:var(--green);color:#000;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:15px;font-weight:600;cursor:pointer;opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s;pointer-events:none}
.analyze-btn.ready{opacity:1;transform:translateY(0);pointer-events:all}

#s-processing{align-items:center;justify-content:center;gap:20px;padding:40px}
.spin{width:70px;height:70px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#s-processing h2{font-size:20px}
#s-processing p{color:var(--muted);font-size:13px;text-align:center}

#s-results{flex-direction:column;overflow-y:auto;padding:24px 20px 40px}
.res-header{text-align:center;margin-bottom:16px}
.res-header h2{font-size:20px;margin-bottom:4px}
.res-header p{color:var(--muted);font-size:13px}
.acc-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(0,230,118,.08);border:1px solid var(--green);border-radius:20px;padding:6px 16px;font-size:13px;color:var(--green);margin-bottom:20px}
.imp-cards{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.imp-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
.imp-card-head{display:flex;justify-content:space-between;margin-bottom:10px}
.imp-tag{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent);background:rgba(0,212,255,.08);padding:3px 8px;border-radius:6px}
.imp-q{font-size:12px;color:var(--green)}
.coords{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.coord{background:var(--bg);border-radius:8px;padding:7px;text-align:center}
.coord span:first-child{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);margin-bottom:2px}
.coord span:last-child{font-family:'IBM Plex Mono',monospace;font-size:12px}
.btns{display:flex;flex-direction:column;gap:8px}
.exp-btn{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;cursor:pointer;width:100%;font-family:'IBM Plex Sans Arabic',sans-serif}
.btn-sec{width:100%;padding:12px;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--muted);font-family:'IBM Plex Sans Arabic',sans-serif;font-size:13px;cursor:pointer;margin-top:8px}
</style>
</head>
<body>

<div class="screen active" id="s-start">
  <div class="brand">IMPLANTSCAN</div>
  <div class="hero">
    <svg width="36" height="36" viewBox="0 0 36 36" fill="none" stroke="#00d4ff" stroke-width="1.5">
      <circle cx="18" cy="18" r="6"/>
      <line x1="18" y1="2" x2="18" y2="9"/>
      <line x1="18" y1="27" x2="18" y2="34"/>
      <line x1="2" y1="18" x2="9" y2="18"/>
      <line x1="27" y1="18" x2="34" y2="18"/>
      <circle cx="18" cy="18" r="2" fill="#00d4ff" stroke="none"/>
    </svg>
  </div>
  <h1>تحديد مواضع الزراعات</h1>
  <p>وجّه الكاميرا نحو الـ scan bodies<br>النظام يتعرف عليهم تلقائياً بـ ArUco</p>
  <div id="lib-status" class="lib-status">جاري تحميل المكتبة...</div>
  <div class="count-row">
    <span class="count-label">عدد الزراعات</span>
    <div class="count-controls">
      <button class="cnt-btn" onclick="changeCount(-1)">−</button>
      <div id="cnt-val">2</div>
      <button class="cnt-btn" onclick="changeCount(1)">+</button>
    </div>
  </div>
  <button class="btn-main" onclick="startScan()">ابدأ الفحص</button>
</div>

<div class="screen" id="s-scan">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay-canvas"></canvas>
  <div class="hud">
    <div class="hud-top">
      <div class="hud-logo">IMPLANTSCAN</div>
      <button class="btn-cancel" onclick="stopScan()">إيقاف</button>
    </div>
    <div style="flex:1"></div>
    <div class="hud-bottom">
      <div class="status-pill">
        <div class="sdot" id="sdot"></div>
        <span id="status-text">جاري البحث عن الماركرات...</span>
      </div>
      <div class="imp-indicators" id="imp-indicators"></div>
      <button class="analyze-btn" id="analyze-btn" onclick="runAnalysis()">تحليل المواضع ←</button>
    </div>
  </div>
</div>

<div class="screen" id="s-processing">
  <div class="spin"></div>
  <h2>جاري الحساب</h2>
  <p>يتم حساب إحداثيات الزراعات</p>
</div>

<div class="screen" id="s-results">
  <div class="res-header">
    <h2>✓ اكتمل التحليل</h2>
    <p id="res-sub"></p>
  </div>
  <div class="acc-badge"><span>●</span><span>ArUco Detection</span></div>
  <div class="imp-cards" id="imp-cards"></div>
  <div class="btns">
    <button class="exp-btn" onclick="exportCSV()">
      <span>📊</span><span>تصدير CSV</span>
    </button>
    <button class="btn-sec" onclick="newScan()">فحص جديد</button>
  </div>
</div>

<script>
// ══ State ══
let implantCount    = 2;
let stream          = null;
let rafId           = null;
let detector        = null;
let detectedMarkers = {};
let capturedFrames  = [];

// ══ Check library ══
window.addEventListener('load', () => {
  const statusEl = document.getElementById('lib-status');
  if (typeof AR !== 'undefined') {
    try {
      detector = new AR.Detector({ dictionaryName: 'ARUCO' });
      statusEl.textContent = '✓ ArUco جاهز';
      statusEl.className   = 'lib-status ok';
    } catch(e) {
      statusEl.textContent = '✗ خطأ بالمكتبة: ' + e.message;
      statusEl.className   = 'lib-status err';
    }
  } else {
    statusEl.textContent = '✗ المكتبة ما حملت — تحقق من الاتصال';
    statusEl.className   = 'lib-status err';
    // retry after 2s
    setTimeout(() => {
      if (typeof AR !== 'undefined') {
        detector = new AR.Detector({ dictionaryName: 'ARUCO' });
        statusEl.textContent = '✓ ArUco جاهز';
        statusEl.className   = 'lib-status ok';
      }
    }, 2000);
  }
});

function goTo(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function changeCount(d) {
  implantCount = Math.max(1, Math.min(10, implantCount + d));
  document.getElementById('cnt-val').textContent = implantCount;
}

// ══ Start ══
async function startScan() {
  if (!detector) {
    if (typeof AR !== 'undefined') {
      detector = new AR.Detector({ dictionaryName: 'ARUCO' });
    } else {
      alert('المكتبة ما حملت — تحقق من الاتصال بالإنترنت وأعد تحميل الصفحة');
      return;
    }
  }

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    const video = document.getElementById('video');
    video.srcObject = stream;
    await video.play();

    detectedMarkers = {};
    capturedFrames  = [];
    buildIndicators();
    goTo('s-scan');
    requestAnimationFrame(trackLoop);
  } catch(e) {
    alert('تعذر فتح الكاميرا: ' + e.message);
  }
}

function buildIndicators() {
  const cont = document.getElementById('imp-indicators');
  cont.innerHTML = '';
  for (let i = 0; i < implantCount; i++) {
    cont.innerHTML += `<div class="imp-circle" id="imp-c-${i}">Z${i+1}</div>`;
  }
}

// ══ Track Loop ══
function trackLoop() {
  const video  = document.getElementById('video');
  const canvas = document.getElementById('overlay-canvas');
  const ctx    = canvas.getContext('2d');

  if (!video.videoWidth) { rafId = requestAnimationFrame(trackLoop); return; }

  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0);

  // ArUco detection
  if (detector) {
    try {
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const markers   = detector.detect(imageData);
      const seen      = new Set();

      markers.forEach(m => {
        seen.add(m.id);
        if (!detectedMarkers[m.id]) {
          detectedMarkers[m.id] = { corners: m.corners, frames: 0 };
        }
        detectedMarkers[m.id].corners = m.corners;
        detectedMarkers[m.id].frames  = Math.min(30, detectedMarkers[m.id].frames + 1);
      });

      Object.keys(detectedMarkers).forEach(id => {
        if (!seen.has(parseInt(id))) {
          detectedMarkers[id].frames = Math.max(0, detectedMarkers[id].frames - 2);
          if (detectedMarkers[id].frames === 0) delete detectedMarkers[id];
        }
      });
    } catch(e) {}
  }

  drawOverlay(ctx);
  updateUI();

  if (capturedFrames.length < 30) {
    capturedFrames.push(canvas.toDataURL('image/jpeg', 0.6));
  }

  rafId = requestAnimationFrame(trackLoop);
}

// ══ Draw ══
function drawOverlay(ctx) {
  Object.entries(detectedMarkers).forEach(([id, m]) => {
    const confirmed = m.frames >= 15;
    const progress  = Math.min(1, m.frames / 15);
    const color     = confirmed ? '#00e676' : '#ffcc00';
    const c         = m.corners;

    // مربع حول الماركر
    ctx.strokeStyle = color;
    ctx.lineWidth   = confirmed ? 3 : 2;
    ctx.globalAlpha = 0.5 + progress * 0.5;
    ctx.beginPath();
    ctx.moveTo(c[0].x, c[0].y);
    ctx.lineTo(c[1].x, c[1].y);
    ctx.lineTo(c[2].x, c[2].y);
    ctx.lineTo(c[3].x, c[3].y);
    ctx.closePath();
    ctx.stroke();
    ctx.globalAlpha = 1;

    // مركز
    const cx = c.reduce((s,p) => s+p.x, 0) / 4;
    const cy = c.reduce((s,p) => s+p.y, 0) / 4;

    // progress arc
    if (!confirmed) {
      ctx.strokeStyle = '#ffcc00';
      ctx.lineWidth   = 3;
      ctx.beginPath();
      ctx.arc(cx, cy, 20, -Math.PI/2, -Math.PI/2 + progress * Math.PI * 2);
      ctx.stroke();
    } else {
      // checkmark
      ctx.fillStyle = '#00e676';
      ctx.font      = 'bold 18px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('✓', cx, cy - 24);
    }

    // ID label
    ctx.fillStyle   = color;
    ctx.font        = 'bold 14px monospace';
    ctx.textAlign   = 'center';
    ctx.globalAlpha = 0.5 + progress * 0.5;
    ctx.fillText(`#${id}`, cx, cy + 32);
    ctx.globalAlpha = 1;
  });
}

// ══ UI ══
function updateUI() {
  const confirmed = Object.values(detectedMarkers).filter(m => m.frames >= 15).length;
  const total     = Object.keys(detectedMarkers).length;

  document.getElementById('sdot').className    = confirmed >= implantCount ? 'sdot found' : 'sdot';
  document.getElementById('status-text').textContent =
    confirmed >= implantCount
      ? `✓ تم تحديد ${confirmed} زراعات`
      : total > 0 ? `مكتشف: ${total} | مؤكد: ${confirmed}/${implantCount}`
      : 'جاري البحث...';

  const btn = document.getElementById('analyze-btn');
  if (confirmed >= implantCount) btn.classList.add('ready');
  else btn.classList.remove('ready');

  const ids = Object.keys(detectedMarkers).filter(id => detectedMarkers[id].frames >= 15);
  for (let i = 0; i < implantCount; i++) {
    const el = document.getElementById(`imp-c-${i}`);
    if (el) el.className = ids[i] !== undefined ? 'imp-circle found' : 'imp-circle';
  }
}

// ══ Analysis ══
async function runAnalysis() {
  if (rafId) cancelAnimationFrame(rafId);
  if (stream) stream.getTracks().forEach(t => t.stop());
  goTo('s-processing');

  const canvas = document.getElementById('overlay-canvas');
  const w = canvas.width || 1280;
  const h = canvas.height || 720;
  const scale = 80 / w;

  const confirmed = Object.entries(detectedMarkers)
    .filter(([,m]) => m.frames >= 15)
    .slice(0, implantCount);

  const results = confirmed.map(([id, m], idx) => {
    const cx = m.corners.reduce((s,p) => s+p.x, 0) / 4;
    const cy = m.corners.reduce((s,p) => s+p.y, 0) / 4;

    // Pose estimation
    let x = ((cx - w/2) * scale).toFixed(3);
    let y = ((cy - h/2) * scale).toFixed(3);
    let z = '0.000';

    try {
      if (typeof POS !== 'undefined') {
        const posit   = new POS.Posit(7.2, w);
        const corners = m.corners.map(c => ({
          x: c.x - w/2,
          y: h/2 - c.y
        }));
        const pose = posit.pose(corners);
        if (pose && pose.bestError < 50) {
          x = pose.bestTranslation[0].toFixed(3);
          y = pose.bestTranslation[1].toFixed(3);
          z = pose.bestTranslation[2].toFixed(3);
        }
      }
    } catch(e) {}

    return {
      id:       idx + 1,
      aruco_id: id,
      x, y, z,
      angle_x:  '0.0',
      angle_y:  '0.0',
      angle_z:  '0.0',
      quality:  Math.min(99, m.frames * 4)
    };
  });

  await new Promise(r => setTimeout(r, 800));
  showResults(results);
}

function showResults(implants) {
  document.getElementById('res-sub').textContent = `${implants.length} زراعة مكتشفة`;
  const cont = document.getElementById('imp-cards');
  cont.innerHTML = '';

  if (!implants.length) {
    cont.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px">ما تم اكتشاف زراعات — جرب مرة ثانية</p>';
  } else {
    implants.forEach(imp => {
      cont.innerHTML += `
        <div class="imp-card">
          <div class="imp-card-head">
            <div class="imp-tag">ArUco #${imp.aruco_id}</div>
            <div class="imp-q">${imp.quality}%</div>
          </div>
          <div class="coords">
            <div class="coord"><span>X</span><span>${imp.x}</span></div>
            <div class="coord"><span>Y</span><span>${imp.y}</span></div>
            <div class="coord"><span>Z</span><span>${imp.z}</span></div>
            <div class="coord"><span>Rx</span><span>${imp.angle_x}</span></div>
            <div class="coord"><span>Ry</span><span>${imp.angle_y}</span></div>
            <div class="coord"><span>Rz</span><span>${imp.angle_z}</span></div>
          </div>
        </div>`;
    });
  }
  goTo('s-results');
}

function stopScan() {
  if (rafId) cancelAnimationFrame(rafId);
  if (stream) stream.getTracks().forEach(t => t.stop());
  goTo('s-start');
}

function exportCSV() {
  const rows = ['Implant,ArUco_ID,X,Y,Z'];
  document.querySelectorAll('.imp-card').forEach((c, i) => {
    const id = c.querySelector('.imp-tag').textContent.replace('ArUco #','');
    const v  = [...c.querySelectorAll('.coord span:last-child')].map(s=>s.textContent);
    rows.push(`Z${i+1},${id},${v.slice(0,3).join(',')}`);
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));
  a.download = `ImplantScan_${Date.now()}.csv`;
  a.click();
}

function newScan() {
  detectedMarkers = {};
  capturedFrames  = [];
  goTo('s-start');
}
</script>
</body>
</html>
