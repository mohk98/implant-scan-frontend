<script type="text/babel" data-presets="custom-react">
const { useState, useEffect } = React;

// ── Firebase ─────────────────────────────────────────
const READY = window.FIREBASE_CONFIG.apiKey !== "REPLACE_API_KEY";
let db = null;
if(READY){ try{ firebase.initializeApp(window.FIREBASE_CONFIG); db=firebase.firestore(); }catch{} }

// ── Helpers ──────────────────────────────────────────
const uid   = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const money = n=>(+(n||0)).toLocaleString("ar-IQ");
const toDay = ()=>new Date().toISOString().split("T")[0];
const fmtDate = s=>s?new Date(s).toLocaleDateString("ar-IQ-u-ca-gregory",{weekday:"long",year:"numeric",month:"long",day:"numeric"}):"";
const fmtDateShort = s=>s?new Date(s).toLocaleDateString("ar-IQ-u-ca-gregory",{year:"numeric",month:"long",day:"numeric"}):"";

const DENTAL = ["حشوه اولية","حشوه دائمية","حشوه جذر ج١","حشوه جذر ج٢","حشوه جذر ج٣","تنظيف","تركيب","طقم","قلع","اشعة","فحص","تقويم","زراعة"];

// ── Palette ──────────────────────────────────────────
// C يصير reactive بعد تعريف App — نستخدم window.darkMode
const getC=(dark=false)=>({
  // Primary — refined deep teal
  teal:"#0d7d74",tM:"#10a599",tL:dark?"#0c2926":"#e2f7f5",tD:"#0a5c55",
  // Semantic
  red:"#e5484d",rL:dark?"#3c1618":"#feebec",
  amb:"#f76808",aL:dark?"#3a1e0a":"#fef1e7",
  grn:"#30a46c",gL:dark?"#0f291e":"#e9f9ef",
  vio:"#6e56cf",vL:dark?"#1e1a33":"#f1eefe",
  // Surfaces
  bg:dark?"#0b0f14":"#f4f6f8",
  card:dark?"#151a21":"#ffffff",
  cardHov:dark?"#1b212a":"#fafcfd",
  txt:dark?"#e8edf2":"#17212b",
  mut:dark?"#8a94a6":"#68778c",
  bdr:dark?"#242c38":"#e6eaef",
  // Elevation
  sh:dark?"0 2px 10px rgba(0,0,0,.55)":"0 1px 3px rgba(23,33,43,.05), 0 4px 14px rgba(23,33,43,.05)",
  shLg:dark?"0 8px 30px rgba(0,0,0,.6)":"0 4px 10px rgba(23,33,43,.06), 0 12px 34px rgba(23,33,43,.09)",
  teal2:dark?"#3fd4c7":"#0d7d74"
});
let C=getC(false);

// ══════════════════════════════════════════════════════
//  Reusable UI
// ══════════════════════════════════════════════════════
const Btn=({children,onClick,outline,danger,green,sm,full,style={}})=>{
  const bg=danger?C.red:green?C.grn:C.tM;
  const base={cursor:"pointer",borderRadius:50,fontWeight:700,fontSize:sm?13:15,
    padding:sm?"7px 18px":"10px 26px",border:"none",transition:"all .15s",
    display:"inline-flex",alignItems:"center",justifyContent:"center",gap:6,
    width:full?"100%":"auto"};
  const s=outline
    ?{...base,background:"transparent",color:danger?C.red:C.tM,border:`1.5px solid ${danger?C.red:C.tM}`}
    :{...base,background:bg,color:"#fff",boxShadow:`0 4px 12px ${bg}44`};
  return <button onClick={onClick} style={{...s,...style}}
    onMouseEnter={e=>e.currentTarget.style.opacity=".85"}
    onMouseLeave={e=>e.currentTarget.style.opacity="1"}>{children}</button>;
};

const Inp=({label,value,onChange,type="text",placeholder,req,autoFocus})=>(
  <div style={{marginBottom:14}}>
    {label&&<label style={{display:"block",fontSize:13,fontWeight:700,color:C.txt,marginBottom:5}}>
      {label}{req&&<span style={{color:C.red}}> *</span>}</label>}
    <input autoFocus={autoFocus} type={type} value={value||""} onChange={e=>onChange(e.target.value)}
      placeholder={placeholder}
      style={{width:"100%",padding:"10px 14px",borderRadius:10,border:`1.5px solid ${C.bdr}`,
        fontSize:14,color:C.txt,background:"#fff",outline:"none"}}
      onFocus={e=>e.target.style.borderColor=C.tM}
      onBlur={e=>e.target.style.borderColor=C.bdr}/>
  </div>
);

const Txta=({label,value,onChange,placeholder})=>(
  <div style={{marginBottom:14}}>
    {label&&<label style={{display:"block",fontSize:13,fontWeight:700,color:C.txt,marginBottom:5}}>{label}</label>}
    <textarea value={value||""} onChange={e=>onChange(e.target.value)} placeholder={placeholder} rows={3}
      style={{width:"100%",padding:"10px 14px",borderRadius:10,border:`1.5px solid ${C.bdr}`,
        fontSize:14,color:C.txt,background:C.card,outline:"none",resize:"vertical"}}
      onFocus={e=>e.target.style.borderColor=C.tM}
      onBlur={e=>e.target.style.borderColor=C.bdr}/>
  </div>
);

const Modal=({title,onClose,children})=>(
  <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",zIndex:200,
    display:"flex",alignItems:"center",justifyContent:"center",padding:16}}
    onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div style={{background:C.card,borderRadius:20,width:"100%",maxWidth:480,
      boxShadow:"0 20px 60px rgba(0,0,0,.2)",maxHeight:"92vh",overflowY:"auto"}}>
      <div style={{padding:"18px 22px 14px",borderBottom:`1px solid ${C.bdr}`,
        display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,background:C.card,zIndex:1}}>
        <h2 style={{margin:0,fontSize:17,fontWeight:800,color:C.txt}}>{title}</h2>
        <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:22,color:C.mut}}>✕</button>
      </div>
      <div style={{padding:"18px 22px 22px"}}>{children}</div>
    </div>
  </div>
);

// ══════════════════════════════════════════════════════
//  PIN Screen
// ══════════════════════════════════════════════════════
function PinScreen({onSuccess}){
  const [pin,setPin]=useState("");
  const [err,setErr]=useState(false);
  const [shake,setShake]=useState(false);
  const press=d=>{
    if(pin.length>=4)return;
    const next=pin+d;
    setPin(next);
    if(next.length===4){
      if(next===window.CLINIC_PIN_DOCTOR){onSuccess("doctor");}
      else if(next===window.CLINIC_PIN_STAFF){onSuccess("staff");}
      else{setShake(true);setErr(true);setTimeout(()=>{setPin("");setShake(false);setErr(false);},700);}
    }
  };
  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",
      background:`linear-gradient(135deg,${C.tD} 0%,${C.tM} 100%)`,padding:20}}>

const normalize = s => (s||"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").trim();

function DailyQueue({patients, onAddVisit, doctors=[]}){
  const [appts,setAppts]     = useState([]);
  const [loading,setLoading] = useState(true);
  const [showAdd,setShowAdd] = useState(false);
  const [newName,setNewName] = useState("");
  const [listening,setListening] = useState(false);
  const [newTreat,setNewTreat]   = useState("");
  const [newDoctors,setNewDoctors] = useState([]); // أطباء المريض
  const [showSug,setShowSug] = useState(false);
  const [linkedPatient,setLinkedPatient] = useState(null);
  const [logVisitFor,setLogVisitFor]   = useState(null);
  const [registerFor,setRegisterFor]   = useState(null);
  const [registerStep,setRegisterStep] = useState("patient");
  const [regPatientId,setRegPatientId] = useState(null);
  const [apptFor,setApptFor]           = useState(null); // quick appointment
  const [editingId,setEditingId]       = useState(null);
  const [editingName,setEditingName]   = useState("");
  const [swipeId,setSwipeId]           = useState(null);
  const [swipeX,setSwipeX]             = useState(0);
  const [swipeStart,setSwipeStart]     = useState(0);
  const [snapId,setSnapId]             = useState(null);
  const [snapDir,setSnapDir]           = useState(null); // "left" | "right"
  const didDrag = React.useRef(false);
  const [hoverId,setHoverId] = useState(null);
  const today = toDay();

  // Realtime listener — ينقل المواعيد من appointments إلى daily أولاً ثم يستمع
  useEffect(()=>{
    let unsub = ()=>{};
    const init = async () => {
      try {
        // الخطوة ١: اقرأ المواعيد المحجوزة مسبقاً
        const aSnap = await db.collection("appointments").doc(today).get();
        const preBooked = aSnap.exists ? (aSnap.data().list||[]) : [];
        if(preBooked.length > 0){
          // الخطوة ٢: اقرأ قائمة اليوم الحالية
          const dSnap = await db.collection("daily").doc(today).get();
          const existing = dSnap.exists ? (dSnap.data().appointments||[]) : [];
          const ids = new Set(existing.map(a=>a.id));
          const toAdd = preBooked.filter(a=>!ids.has(a.id));
          // الخطوة ٣: ادمج واحفظ بـ daily وامسح من appointments
          const merged = [...existing, ...toAdd];
          await db.collection("daily").doc(today).set({appointments:merged, date:today},{merge:true});
          await db.collection("appointments").doc(today).set({list:[], date:today},{merge:true});
        }
      } catch(e){ console.error("migration error", e); }
      // الخطوة ٤: بعد ما خلص النقل، ابدأ الاستماع لـ daily فقط
      unsub = db.collection("daily").doc(today).onSnapshot(snap=>{
        setAppts(snap.exists?(snap.data().appointments||[]):[]);
        setLoading(false);
      });
    };
    init();
    return ()=>{ unsub(); };
  },[]);

  // Suggestions — recomputed whenever newName or patients change
  const suggestions = !newName.trim() ? [] :
    patients.filter(p => normalize(p.name).includes(normalize(newName))).slice(0,5);

  const save = async list =>
    await db.collection("daily").doc(today).set({appointments:list, date:today});

  // Use onMouseDown (fires BEFORE onBlur) so dropdown doesn't close before selection
  const selectFromArchive = p => {
    setNewName(p.name);
    setLinkedPatient(p);
    setShowSug(false);
  };

  const addAppt = async () => {
    if(!newName.trim()) return;
    const appt = {
      id: uid(), name: newName.trim(), treatment: newTreat,
      doctors: newDoctors,
      patientId: linkedPatient?.id || null,
      queueNum: null, done: false, visitLogged: false,
      createdAt: new Date().toISOString()
    };
    await save([...appts, appt]);
    setNewName(""); setNewTreat(""); setNewDoctors([]); setLinkedPatient(null); setShowSug(false); setShowAdd(false);
  };

  const addApptAndArrive = async () => {
    if(!newName.trim()) return;
    const nums = appts.filter(a=>a.queueNum).map(a=>a.queueNum);
    const nextNum = (nums.length ? Math.max(...nums) : 0) + 1;
    const appt = {
      id: uid(), name: newName.trim(), treatment: newTreat,
      doctors: newDoctors,
      patientId: linkedPatient?.id || null,
      queueNum: nextNum, done: false, visitLogged: false,
      createdAt: new Date().toISOString()
    };
    await save([...appts, appt]);
    setNewName(""); setNewTreat(""); setNewDoctors([]); setLinkedPatient(null); setShowSug(false); setShowAdd(false);
  };

  const startVoice = () => {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SpeechRec){ alert("متصفحك لا يدعم التعرف على الصوت، استخدم Chrome"); return; }
    const rec = new SpeechRec();
    rec.lang = "ar-IQ";
    rec.continuous = false;
    rec.interimResults = false;
    setListening(true);
    rec.onresult = e => {
      const text = e.results[0][0].transcript;
      setNewName(text);
      setLinkedPatient(null);
      setShowSug(true);
      setListening(false);
    };
    rec.onerror = () => setListening(false);
    rec.onend   = () => setListening(false);
    rec.start();
  };

  const arrive   = async id => {
    const nums = appts.filter(a=>a.queueNum).map(a=>a.queueNum);
    await save(appts.map(a=>a.id===id ? {...a, queueNum:(nums.length?Math.max(...nums):0)+1} : a));
  };
  const markDone = async id => await save(appts.map(a=>a.id===id ? {...a,done:true}  : a));
  const undoDone = async id => await save(appts.map(a=>a.id===id ? {...a,done:false} : a));
  const unarrive = async id => await save(appts.map(a=>a.id===id ? {...a,queueNum:null} : a));
  const renamePt = async (id, name) => {
    if(!name.trim()) return;
    await save(appts.map(a=>a.id===id ? {...a,name:name.trim()} : a));
    setEditingId(null);
  };
  const changeQueueNum = async (id, newNum) => {
    const n = parseInt(newNum);
    if(isNaN(n)||n<1) return;
    await save(appts.map(a=>a.id===id ? {...a,queueNum:n} : a));
  };
  const removeAppt = async id => {
    if(!confirm("حذف من القائمة؟")) return;
    await save(appts.filter(a=>a.id!==id));
  };
  const handleLogVisit = async (appt, visitData) => {
    await onAddVisit(appt.patientId, visitData);
    await save(appts.map(a=>a.id===appt.id ? {...a,visitLogged:true} : a));
    setLogVisitFor(null);
  };

  const saveQuickAppt = async f => {
    const ref = db.collection("appointments").doc(f.date);
    const snap = await ref.get();
    const list = snap.exists ? (snap.data().list||[]) : [];
    await ref.set({list:[...list,{id:uid(),name:f.name,treatment:f.treatment,
      createdAt:new Date().toISOString()}], date:f.date});
    setApptFor(null);
  };

  // Register NEW patient from queue → step 1: create patient
  const handleRegisterPatient = async (patientData) => {
    const ref = await db.collection("patients").add({
      ...patientData, visits:[], createdAt:new Date().toISOString()
    });
    // link appointment to new patient
    await save(appts.map(a=>a.id===registerFor.id ? {...a,patientId:ref.id} : a));
    setRegPatientId(ref.id);
    setRegisterStep("visit"); // move to visit step
  };

  // Register NEW patient → step 2: log visit
  const handleRegisterVisit = async (visitData) => {
    await onAddVisit(regPatientId, visitData);
    await save(appts.map(a=>a.id===registerFor.id ? {...a,visitLogged:true} : a));
    setRegisterFor(null); setRegisterStep("patient"); setRegPatientId(null);
  };

  // Sort: in-queue → waiting → done
  const sorted = [...appts].sort((a,b)=>{
    if(a.done&&!b.done) return 1; if(!a.done&&b.done) return -1;
    if(a.queueNum&&b.queueNum) return a.queueNum-b.queueNum;
    if(a.queueNum&&!b.queueNum) return -1; if(!a.queueNum&&b.queueNum) return 1;
    return new Date(a.createdAt)-new Date(b.createdAt);
  });

  const total   = appts.length;
  const inQueue = appts.filter(a=>a.queueNum&&!a.done).length;
  const done    = appts.filter(a=>a.done).length;
  const waiting = appts.filter(a=>!a.queueNum&&!a.done).length;

  if(loading) return <div style={{padding:40,textAlign:"center",color:C.mut}}>⏳</div>;

  return(
    <div>
      {/* Date header */}
      <div style={{background:`linear-gradient(135deg,${C.tD},${C.tM})`,borderRadius:18,
        padding:"18px 20px",marginBottom:18,color:"#fff",
        display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div>
          <div style={{fontSize:13,opacity:.8,marginBottom:2}}>قائمة اليوم</div>
          <div style={{fontSize:17,fontWeight:800}}>{fmtDate(today)}</div>
        </div>
        <button onClick={()=>{setShowAdd(true);setTimeout(()=>document.getElementById("nameInput")?.focus(),100);}}
          style={{background:"rgba(255,255,255,.2)",border:"2px solid rgba(255,255,255,.5)",
            borderRadius:12,padding:"8px 16px",color:"#fff",cursor:"pointer",fontWeight:800,fontSize:14}}>
          ➕ إضافة
        </button>
      </div>

      {/* Stats */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:18}}>
        {[["الكل",total,"#0d9488"],["منتظر",waiting,"#dd6b20"],["بالسرة",inQueue,"#6366f1"],["خلص",done,"#2f855a"]].map(([lbl,val,clr])=>(
          <div key={lbl} style={{background:C.card,borderRadius:14,padding:"12px 4px 10px",
            textAlign:"center",boxShadow:C.sh,
            borderTop:`3px solid ${clr}`}}>
            <div style={{fontSize:26,fontWeight:900,color:clr,lineHeight:1}}>{val}</div>
            <div style={{fontSize:10,color:C.mut,marginTop:4,fontWeight:700,letterSpacing:.3}}>{lbl}</div>
          </div>
        ))}
      </div>

      {/* Add form */}
      {showAdd&&(
        <div style={{background:C.card,borderRadius:18,padding:18,boxShadow:C.sh,
          marginBottom:18,border:`2px solid ${C.tM}`}}>
          <div style={{fontWeight:800,fontSize:15,marginBottom:14,color:C.tM}}>➕ إضافة مريض لليوم</div>

          {/* Name input */}
          <div style={{marginBottom:14}}>
            <label style={{display:"block",fontSize:13,fontWeight:700,color:C.txt,marginBottom:5}}>
              اسم المريض <span style={{color:C.red}}>*</span>
            </label>
            <div style={{position:"relative"}}>
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                <input
                  id="nameInput"
                  value={newName}
                  onChange={e=>{ setNewName(e.target.value); setLinkedPatient(null); setShowSug(true); }}
                  onFocus={()=>setShowSug(true)}
                  onBlur={()=>setTimeout(()=>setShowSug(false), 150)}
                  placeholder="اكتب اسم المريض..."
                  style={{flex:1,padding:"11px 14px",
                    borderRadius:10,border:`1.5px solid ${linkedPatient?C.tM:C.bdr}`,
                    fontSize:14,color:C.txt,background:C.card,outline:"none"}}/>
                <button onClick={startVoice} title="إدخال صوتي"
                  style={{width:42,height:42,borderRadius:10,border:"none",cursor:"pointer",
                    flexShrink:0,fontSize:20,
                    background:listening?C.tM:C.bg,
                    color:listening?"#fff":C.mut,
                    transition:"all .2s",
                    boxShadow:listening?`0 0 0 3px ${C.tM}44`:"none"}}>
                  {listening?"🔴":"🎤"}
                </button>
              </div>

              {/* Dropdown */}
              {showSug && newName.trim() && (
                <div style={{position:"absolute",top:"calc(100% + 4px)",right:0,left:0,zIndex:200,
                  background:C.card,borderRadius:12,
                  boxShadow:"0 8px 30px rgba(0,0,0,.18)",
                  border:`1px solid ${C.bdr}`,overflow:"hidden"}}>

                  {suggestions.length>0&&(
                    <div>
                      <div style={{padding:"7px 14px",fontSize:11,color:C.mut,
                        background:C.bg,borderBottom:`1px solid ${C.bdr}`,fontWeight:700}}>
                        📂 موجود في الأرشيف
                      </div>
                      {suggestions.map(p=>(
                        <div key={p.id}
                          onMouseDown={()=>selectFromArchive(p)}
                          style={{padding:"11px 14px",cursor:"pointer",
                            display:"flex",alignItems:"center",gap:10,
                            borderBottom:`1px solid ${C.bdr}`,background:C.card}}
                          onMouseEnter={e=>e.currentTarget.style.background=C.tL}
                          onMouseLeave={e=>e.currentTarget.style.background=C.card}>
                          <span style={{fontSize:18}}>{p.gender==="أنثى"?"👩":"👨"}</span>
                          <div style={{flex:1}}>
                            <div style={{fontWeight:700,fontSize:14,color:C.txt}}>{p.name}</div>
                            <div style={{fontSize:11,color:C.mut}}>
                              {p.visits?.length||0} زيارة سابقة{p.phone?` • ${p.phone}`:""}
                            </div>
                          </div>
                          <span style={{background:C.tL,color:C.tM,
                            fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:20}}>
                            🔗 ربط
                          </span>
                        </div>
                      ))}
                    </div>
                  )}

                  {/* Always show "add as new" option */}
                  <div onMouseDown={()=>setShowSug(false)}
                    style={{padding:"10px 14px",cursor:"default",
                      fontSize:13,color:C.mut,background:C.bg,
                      display:"flex",alignItems:"center",gap:8}}>
                    <span>➕</span>
                    <span>إضافة "<strong style={{color:C.txt}}>{newName}</strong>" كمريض جديد (بدون ربط)</span>
                  </div>
                </div>
              )}
            </div>

            {/* Linked badge */}
            {linkedPatient&&(
              <div style={{marginTop:8,background:C.tL,borderRadius:8,padding:"7px 12px",
                fontSize:13,color:C.tM,fontWeight:700,display:"flex",alignItems:"center",gap:8}}>
                🔗 مرتبط: {linkedPatient.name} ({linkedPatient.visits?.length||0} زيارة سابقة)
                <button onMouseDown={()=>setLinkedPatient(null)}
                  style={{background:"none",border:"none",cursor:"pointer",
                    color:C.mut,fontSize:16,marginRight:"auto",lineHeight:1}}>✕</button>
              </div>
            )}
          </div>

          {/* Treatment types */}
          <div style={{marginBottom:16}}>
            <label style={{display:"block",fontSize:13,fontWeight:700,color:C.txt,marginBottom:8}}>نوع العلاج</label>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {DENTAL.map(t=>{const sel=newTreat===t; return(
                <button key={t} onMouseDown={()=>setNewTreat(sel?"":t)} type="button"
                  style={{padding:"5px 12px",borderRadius:20,
                    border:`1.5px solid ${sel?C.tM:C.bdr}`,
                    background:sel?C.tL:C.card,color:sel?C.tM:C.mut,
                    fontSize:12,fontWeight:sel?700:400,cursor:"pointer"}}>
                  {t}
                </button>
              );})}
            </div>
          </div>

          {doctors.length>0&&<div style={{marginBottom:14}}>
            <label style={{display:"block",fontSize:13,fontWeight:700,color:C.txt,marginBottom:8}}>الطبيب المعالج</label>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {doctors.map(d=>{
                const sel=newDoctors.some(x=>x.id===d.id);
                return(
                  <button key={d.id} type="button"
                    onMouseDown={()=>setNewDoctors(prev=>sel?prev.filter(x=>x.id!==d.id):[...prev,d])}
                    style={{padding:"5px 12px",borderRadius:20,
                      border:`1.5px solid ${sel?C.tM:C.bdr}`,
                      background:sel?C.tL:C.card,color:sel?C.tM:C.mut,
                      fontSize:12,fontWeight:sel?700:400,cursor:"pointer"}}>
                    👨‍⚕️ {d.name}
                  </button>
                );
              })}
            </div>
          </div>}

          <div style={{display:"flex",gap:8}}>
            <Btn outline onClick={()=>{setShowAdd(false);setNewName("");setNewTreat("");setNewDoctors([]);setLinkedPatient(null);}} style={{borderRadius:12,padding:"9px 16px",fontSize:13}}>إلغاء</Btn>
            <Btn outline onClick={addAppt} style={{flex:1,borderRadius:12,padding:"9px 14px",fontSize:13}}>➕ إضافة فقط</Btn>
            <Btn green onClick={addApptAndArrive} style={{flex:1,borderRadius:12,padding:"9px 14px",fontSize:13}}>🪑 إضافة وتسجيل حضور</Btn>
          </div>
        </div>
      )}

      {/* Empty state */}
      {sorted.length===0&&(
        <div style={{background:C.card,borderRadius:18,padding:48,textAlign:"center",color:C.mut,boxShadow:C.sh}}>
          <div style={{fontSize:50,marginBottom:12}}>📋</div>
          <div style={{fontSize:16,fontWeight:700,marginBottom:6}}>لا يوجد مرضى اليوم</div>
          <div style={{fontSize:14,marginBottom:20}}>ابدأ بإضافة المرضى المحجوزين</div>
          <Btn onClick={()=>setShowAdd(true)}>➕ إضافة أول مريض</Btn>
        </div>
      )}

      {/* Queue list */}
      {sorted.map(a=>{
        const isDone   = a.done;
        const isActive = a.queueNum && !isDone;
        const isWaiting= !a.queueNum && !isDone;
        const isLinked = !!a.patientId;
        const linkedPt = isLinked ? patients.find(p=>p.id===a.patientId) : null;
        return(
          <div key={a.id} style={{marginBottom:10}}>
            {/* Swipeable row wrapper — فقط للكروت غير المنتهية */}
            <div style={{position:"relative",overflow:"hidden",
              borderRadius:isDone&&isLinked&&!a.visitLogged?"16px 16px 0 0":16}}>
              {/* Delete bg - يطلع لما ينسحب يسار */}
              {!isDone&&<div onClick={()=>{removeAppt(a.id);setSnapId(null);}}
                style={{position:"absolute",left:0,top:0,bottom:0,width:84,
                  background:C.red,display:"flex",alignItems:"center",justifyContent:"center",
                  cursor:"pointer"}}>
                <div style={{color:"#fff",fontSize:13,fontWeight:800,textAlign:"center"}}>
                  <div style={{fontSize:22}}>🗑</div>حذف
                </div>
              </div>}
              {/* Undo bg - يطلع لما ينسحب يمين */}
              {isActive&&<div onClick={()=>{unarrive(a.id);setSnapId(null);}}
                style={{position:"absolute",right:0,top:0,bottom:0,width:84,
                  background:"#475569",display:"flex",alignItems:"center",justifyContent:"center",
                  cursor:"pointer"}}>
                <div style={{color:"#fff",fontSize:13,fontWeight:800,textAlign:"center"}}>
                  <div style={{fontSize:22}}>↩</div>رجوع
                </div>
              </div>}
              {/* Row */}
              <div
              onTouchStart={e=>{
                if(isDone)return;
                if(snapId===a.id){setSnapId(null);return;}
                setSwipeId(a.id);setSwipeStart(e.touches[0].clientX);setSwipeX(0);
              }}
              onTouchMove={e=>{
                if(isDone||swipeId!==a.id)return;
                const dx=e.touches[0].clientX-swipeStart;
                setSwipeX(Math.max(-84,Math.min(isActive?84:0,dx)));
              }}
              onTouchEnd={()=>{
                if(isDone||swipeId!==a.id)return;
                if(swipeX<-50){setSnapId(a.id);setSnapDir("left");}
                else if(swipeX>50&&isActive){setSnapId(a.id);setSnapDir("right");}
                else{setSnapId(null);}
                setSwipeId(null);setSwipeX(0);
              }}
              onMouseEnter={()=>{ if(!isDone) setHoverId(a.id); }}
              onMouseLeave={()=>setHoverId(null)}
              style={{
              transform:snapId===a.id?(snapDir==="left"?"translateX(-84px)":"translateX(84px)")
                :swipeId===a.id?`translateX(${swipeX}px)`:"translateX(0)",
              transition:swipeId===a.id?"none":"transform .25s ease",
              background:C.card,
              borderRadius:0,
              padding:"14px 16px",
              boxShadow:isDone?"none":isActive?"0 4px 20px rgba(13,148,136,.15)":C.sh,
              display:"flex",alignItems:"center",gap:12,
              borderRight:`4px solid ${isDone?"#cbd5e1":isActive?C.tM:C.amb}`}}>

              {/* Queue badge */}
              {isActive ? (
                <div
                  onClick={()=>{const n=prompt("رقم السرة الجديد:",a.queueNum);if(n)changeQueueNum(a.id,n);}}
                  title="اضغط لتغيير رقم السرة"
                  style={{width:46,height:46,borderRadius:16,flexShrink:0,
                    background:`linear-gradient(135deg,${C.tM},${C.tD})`,cursor:"pointer",
                    display:"flex",alignItems:"center",justifyContent:"center",
                    fontSize:20,fontWeight:900,color:"#fff",
                    boxShadow:`0 4px 14px ${C.tM}50`,
                    border:"2px dashed rgba(255,255,255,0.4)"}}>
                  {a.queueNum}
                </div>
              ) : (
                <div style={{width:46,height:46,borderRadius:16,flexShrink:0,
                  background:isDone?"#cbd5e1":C.aL,
                  display:"flex",alignItems:"center",justifyContent:"center",
                  fontSize:isDone?18:20,fontWeight:900,
                  color:isDone?"#fff":C.amb}}>
                  {isDone?"✓":"؟"}
                </div>
              )}

              {/* Info */}
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
                  {editingId===a.id ? (
                    <input autoFocus
                      value={editingName}
                      onChange={e=>setEditingName(e.target.value)}
                      onKeyDown={e=>{
                        if(e.key==="Enter") renamePt(a.id,editingName);
                        if(e.key==="Escape") setEditingId(null);
                      }}
                      onBlur={()=>renamePt(a.id,editingName)}
                      style={{fontWeight:800,fontSize:15,border:`1.5px solid ${C.tM}`,
                        borderRadius:8,padding:"3px 8px",color:C.txt,background:C.card,
                        outline:"none",width:"140px",fontFamily:"Cairo,sans-serif"}}/>
                  ) : (
                    <span
                      onClick={()=>{setEditingId(a.id);setEditingName(a.name);}}
                      title="اضغط لتعديل الاسم"
                      style={{fontWeight:800,fontSize:14,color:isDone?C.mut:C.txt,
                        textDecoration:isDone?"line-through":"none",cursor:"text",
                        wordBreak:"break-word"}}>
                      {a.name}
                    </span>
                  )}
                  {isLinked&&<span title="مرتبط بالأرشيف" style={{fontSize:14}}>🔗</span>}
                </div>
                {a.treatment&&(
                  <span style={{background:isDone?C.bg:C.tL,color:isDone?C.mut:C.tM,
                    fontSize:12,fontWeight:700,padding:"2px 10px",borderRadius:20,
                    marginTop:4,display:"inline-block"}}>{a.treatment}</span>
                )}
                {(a.doctors&&a.doctors.length>0)&&(
                  <div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:4}}>
                    {a.doctors.map(d=>(
                      <span key={d.id} style={{background:C.bg,color:C.mut,border:`1px solid ${C.bdr}`,
                        fontSize:11,padding:"2px 8px",borderRadius:14,
                        whiteSpace:"nowrap",maxWidth:"140px",overflow:"hidden",textOverflow:"ellipsis",
                        display:"inline-block"}}>
                        👨‍⚕️ {d.name}
                      </span>
                    ))}
                  </div>
                )}
              </div>

      {/* Clear done */}
      {done>0&&(
        <div style={{textAlign:"center",marginTop:14}}>

            diagnosis:"",notes:"",total:"",paid:"",
            doctors:logVisitFor.doctors||[]}}
          onClose={()=>setLogVisitFor(null)}
          doctors={doctors}
          priorDebt={(()=>{
            const pt=patients.find(p=>p.id===logVisitFor.patientId);
            if(!pt) return 0;
            return (pt.visits||[]).reduce((s,v)=>s+Math.max(0,(+(v.total)||0)-(+(v.paid)||0)),0);
          })()}
          onSave={visitData=>handleLogVisit(logVisitFor,visitData)}/>
      )}

      {/* Register new patient — step 1: patient info */}
      {registerFor&&registerStep==="patient"&&(
        <PatientModal
          patient={{name:registerFor.name}}
          onClose={()=>{setRegisterFor(null);setRegisterStep("patient");}}

        <VisitModal

            diagnosis:"",notes:"",total:"",paid:"",
            doctors:registerFor.doctors||[]}}
          onClose={()=>{setRegisterFor(null);setRegisterStep("patient");setRegPatientId(null);}}
          doctors={doctors}
          onSave={handleRegisterVisit}/>
      )}
    </div>
  );
}

function addDays(dateStr, n){
  const d = new Date(dateStr); d.setDate(d.getDate()+n); return d.toISOString().split("T")[0];
}
const QUICK_DAYS = [
  {label:"غداً",      n:1},
  {label:"بعد يومين", n:2},
  {label:"بعد 3 أيام",n:3},
  {label:"بعد أسبوع", n:7},
  {label:"بعد أسبوعين",n:14},
  {label:"تاريخ محدد", n:null},
];

const DAY_NAMES = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
function getNext7Days(){
  return Array.from({length:7},(_,i)=>{
    const d = new Date(); d.setDate(d.getDate()+i+1);
    const str = d.toISOString().split("T")[0];
    const dayName = DAY_NAMES[d.getDay()];
    const label = `${d.getDate()}/${d.getMonth()+1}`;
    return {str, dayName, label};
  });
}

function DayCard({date, onAddAppt, patients=[]}){
  const [appts,setAppts]=useState([]);
  const isToday = date===toDay();
  // Today reads from 'daily' collection (same as daily queue page)
  // Future days read from 'appointments' collection
  const collName = isToday ? "daily" : "appointments";
  const docField = isToday ? "appointments" : "list";

  useEffect(()=>{
    if(!isToday){
      // أيام مستقبلية: اقرأ من appointments فقط
      const unsub=db.collection("appointments").doc(date).onSnapshot(snap=>{
        setAppts(snap.exists?(snap.data().list||[]):[]);
      });
      return unsub;
    }
    // اليوم: انقل من appointments لـ daily مرة وحدة ثم استمع لـ daily
    db.collection("appointments").doc(date).get().then(aSnap=>{
      const apptList = aSnap.exists ? (aSnap.data().list||[]) : [];
      if(apptList.length>0){
        db.collection("daily").doc(date).get().then(dSnap=>{
          const dailyList = dSnap.exists ? (dSnap.data().appointments||[]) : [];
          const ids = new Set(dailyList.map(a=>a.id));
          const extra = apptList.filter(a=>!ids.has(a.id));
          if(extra.length>0){
            const merged = [...dailyList,...extra];
            db.collection("daily").doc(date).set({appointments:merged,date},{merge:true});
          }
          db.collection("appointments").doc(date).set({list:[],date},{merge:true});
        });
      }
    });
    const unsub=db.collection("daily").doc(date).onSnapshot(snap=>{
      setAppts(snap.exists?(snap.data().appointments||[]):[]);
    });
    return unsub;
  },[date]);

  const removeAppt=async id=>{
    if(!confirm("حذف الموعد؟"))return;
    const nl=appts.filter(a=>a.id!==id);
    await db.collection(collName).doc(date).set(
      isToday ? {appointments:nl,date} : {list:nl,date}
    );
  };

  const d=new Date(date+"T12:00:00");
  const dayName =d.toLocaleDateString("ar-IQ-u-ca-gregory",{weekday:"long"});
  const shortDate=d.toLocaleDateString("ar-IQ-u-ca-gregory",{day:"numeric",month:"numeric"});

  return(
    <div style={{background:C.card,borderRadius:16,boxShadow:C.sh,overflow:"hidden",
      border:`2px solid ${isToday?C.tM:C.bdr}`,marginBottom:12}}>
      <div style={{background:isToday?C.tM:C.bg,padding:"10px 16px",
        display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontWeight:900,fontSize:15,color:isToday?"#fff":C.txt}}>{dayName}</span>
          <span style={{fontSize:12,color:isToday?"rgba(255,255,255,.75)":C.mut}}>{shortDate}</span>
          {isToday&&<span style={{background:"rgba(255,255,255,.25)",color:"#fff",
            fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:20}}>اليوم</span>}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          {appts.length>0&&<span style={{background:isToday?"rgba(255,255,255,.25)":C.tL,
            color:isToday?"#fff":C.tM,fontSize:11,fontWeight:700,
            padding:"2px 9px",borderRadius:20}}>{appts.length}</span>}
          <button onClick={()=>onAddAppt(date)}
            style={{background:isToday?"rgba(255,255,255,.2)":C.card,
              border:isToday?"1.5px solid rgba(255,255,255,.4)":`1.5px solid ${C.bdr}`,
              borderRadius:8,padding:"4px 10px",cursor:"pointer",
              fontSize:13,fontWeight:800,color:isToday?"#fff":C.tM}}>➕</button>
        </div>
      </div>
      {appts.length===0?(
        <div style={{padding:"10px 16px",fontSize:12,color:C.mut}}>لا توجد مواعيد</div>
      ):(
        <div style={{padding:"6px 12px"}}>
          {appts.map((a,i)=>(
            <div key={a.id} style={{display:"flex",alignItems:"center",gap:10,
              padding:"7px 4px",borderBottom:i<appts.length-1?`1px solid ${C.bdr}`:"none"}}>
              <span style={{background:C.tL,color:C.tM,fontSize:11,fontWeight:900,
                width:22,height:22,borderRadius:"50%",display:"flex",
                alignItems:"center",justifyContent:"center",flexShrink:0}}>{i+1}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                  <span style={{fontWeight:700,fontSize:14,color:C.txt}}>{a.name}</span>
                  {(()=>{const pt=patients.find(p=>p.id===a.patientId);return pt&&pt.phone?(
                    <span onClick={e=>{e.stopPropagation();
                      const raw=pt.phone.replace(/[^0-9]/g,"");
                      const phone=raw.startsWith("964")?raw:raw.startsWith("0")?"964"+raw.slice(1):"964"+raw;
                      const msg=encodeURIComponent("السلام عليكم "+pt.name+",\nنذكركم بموعدكم في عيادة "+window.CLINIC_NAME+".\nشكراً لثقتكم 🦷");
                      window.open("https://wa.me/"+phone+"?text="+msg,"_blank");}}
                      title="تذكير واتساب"
                      style={{fontSize:15,cursor:"pointer",userSelect:"none"}}>💬</span>
                  ):null;})()}
                </div>
                {a.treatment&&<div style={{fontSize:11,color:C.mut}}>{a.treatment}</div>}
              </div>
              <button onClick={()=>removeAppt(a.id)}
                style={{background:"none",border:"none",cursor:"pointer",
                  color:C.mut,fontSize:15,padding:"2px 6px"}}>✕</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function Appointments({patients=[]}){
  const [addForDate,setAddForDate]=useState(null);
  const days=Array.from({length:7},(_,i)=>addDays(toDay(),i+1)); // start from tomorrow
  const saveAppt=async f=>{
    const isToday2 = f.date===toDay();
    const entry = {id:uid(),name:f.name,treatment:f.treatment||"",
      createdAt:new Date().toISOString()};
    if(isToday2){
      // Save to 'daily' collection so daily queue page shows it
      const ref=db.collection("daily").doc(f.date);
      const snap=await ref.get();
      const cur=snap.exists?(snap.data().appointments||[]):[];
      // add as daily queue entry (without queue number)
      await ref.set({
        appointments:[...cur,{...entry,queueNum:null,done:false,visitLogged:false,patientId:null}],
        date:f.date
      });
    } else {
      // Future date: save to 'appointments' collection
      const ref=db.collection("appointments").doc(f.date);
      const snap=await ref.get();
      const cur=snap.exists?(snap.data().list||[]):[];
      await ref.set({list:[...cur,entry],date:f.date});
    }
    setAddForDate(null);
  };
  return(
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18}}>
        <div>
          <h2 style={{margin:0,fontSize:19,fontWeight:800}}>📅 المواعيد</h2>
          <div style={{fontSize:13,color:C.mut,marginTop:3}}>اليوم + الأيام السبعة القادمة</div>
        </div>
        <Btn sm onClick={()=>setAddForDate("pick")}>➕ إضافة موعد</Btn>
      </div>
      {days.map(date=>(
        <DayCard key={date} date={date} onAddAppt={d=>setAddForDate(d)} patients={patients}/>
      ))}
      {addForDate&&(
        <QuickApptModal
          key={addForDate}
          patients={patients}
          fixedDate={addForDate==="pick"?null:addForDate}
          defaultName="" defaultTreat=""
          onClose={()=>setAddForDate(null)}
          onSave={f=>saveAppt({...f,date:addForDate==="pick"?f.date:addForDate})}/>
      )}
    </div>
  );
}

  return(

function Inventory(){
  const [items,setItems]   = useState([]);
  const [loading,setLoading] = useState(true);
  const [modal,setModal]   = useState(null);
  const [search,setSearch] = useState("");

  useEffect(()=>{
    const unsub = db.collection("inventory").orderBy("createdAt","asc").onSnapshot(snap=>{
      setItems(snap.docs.map(d=>({id:d.id,...d.data()})));
      setLoading(false);
    }, ()=>setLoading(false));
    return unsub;
  },[]);

  const addItem = async f => {
    await db.collection("inventory").add({...f, quantity:+(f.quantity)||0,
      lowAlert:+(f.lowAlert)||0, createdAt:new Date().toISOString()});
    setModal(null);
  };
  const editItem = async (id,f) => {
    await db.collection("inventory").doc(id).update({
      name:f.name, quantity:+(f.quantity)||0, unit:f.unit,
      lowAlert:+(f.lowAlert)||0, notes:f.notes
    });
    setModal(null);
  };
  const deleteItem = async id => {
    if(!confirm("حذف هذه المادة؟")) return;
    await db.collection("inventory").doc(id).delete();
  };
  const adjustQty = async (id, delta) => {
    const item = items.find(i=>i.id===id);
    const newQty = Math.max(0, (item.quantity||0) + delta);
    await db.collection("inventory").doc(id).update({quantity: newQty});
  };

  const filtered = items.filter(i=>
    i.name.includes(search) || (i.notes||"").includes(search)
  );
  const lowStock = items.filter(i=> i.lowAlert>0 && i.quantity <= i.lowAlert);

  if(loading) return <div style={{padding:40,textAlign:"center",color:C.mut}}>⏳</div>;

  return(
    <div>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18,gap:10}}>
        <div>
          <h2 style={{margin:0,fontSize:19,fontWeight:800}}>📦 المخزن</h2>
          <div style={{fontSize:13,color:C.mut,marginTop:3}}>{items.length} مادة مسجلة</div>
        </div>
        <Btn onClick={()=>setModal("add")}>➕ إضافة مادة</Btn>
      </div>

      {/* Low stock alert */}
      {lowStock.length>0&&(
        <div style={{background:C.rL,border:`1.5px solid ${C.red}88`,borderRadius:14,
          padding:"12px 16px",marginBottom:18}}>
          <div style={{fontWeight:800,color:C.red,fontSize:14,marginBottom:8}}>
            ⚠️ مواد تحتاج تعبئة ({lowStock.length})
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
            {lowStock.map(i=>(
              <span key={i.id} style={{background:C.card,border:`1px solid ${C.red}66`,
                borderRadius:20,padding:"4px 12px",fontSize:13,color:C.red,fontWeight:700}}>
                {i.name} — {i.quantity} {i.unit}
              </span>
            ))}
          </div>
        </div>
      )}

      {/* Search */}
      <input value={search} onChange={e=>setSearch(e.target.value)}
        placeholder="🔍 ابحث عن مادة..."
        style={{width:"100%",padding:"11px 16px",borderRadius:12,
          border:`1.5px solid ${C.bdr}`,fontSize:14,background:C.card,
          outline:"none",marginBottom:16}}
        onFocus={e=>e.target.style.borderColor=C.tM}
        onBlur={e=>e.target.style.borderColor=C.bdr}/>

      {/* Items */}
      {filtered.length===0?(
        <div style={{background:C.card,borderRadius:16,padding:40,
          textAlign:"center",color:C.mut,boxShadow:C.sh}}>
          <div style={{fontSize:44,marginBottom:10}}>📦</div>
          <div style={{fontWeight:700,fontSize:16,marginBottom:8}}>
            {search?"لا توجد نتائج":"المخزن فارغ"}
          </div>
          {!search&&<Btn onClick={()=>setModal("add")}>➕ أضف أول مادة</Btn>}
        </div>
      ):filtered.map(item=>{
        const isLow = item.lowAlert>0 && item.quantity<=item.lowAlert;
        const isEmpty = item.quantity===0;
        const qtyColor = isEmpty?C.red : isLow?C.amb : C.tM;
        const qtyBg    = isEmpty?C.rL  : isLow?C.aL  : C.tL;
        return(
          <div key={item.id} style={{background:C.card,borderRadius:16,
            padding:"16px 18px",boxShadow:C.sh,marginBottom:10,
            borderRight:`4px solid ${qtyColor}`}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>

              {/* Qty badge */}
              <div style={{background:qtyBg,borderRadius:12,padding:"10px 14px",
                textAlign:"center",flexShrink:0,minWidth:64}}>
                <div style={{fontSize:22,fontWeight:900,color:qtyColor,lineHeight:1}}>
                  {item.quantity}
                </div>
                <div style={{fontSize:11,color:qtyColor,marginTop:2}}>{item.unit}</div>
              </div>

              {/* Info */}
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:800,fontSize:15,color:C.txt}}>{item.name}</div>
                {item.notes&&(
                  <div style={{fontSize:12,color:C.mut,marginTop:3,
                    overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                    {item.notes}
                  </div>
                )}
                {isLow&&!isEmpty&&(
                  <span style={{background:C.aL,color:C.amb,fontSize:11,
                    fontWeight:700,padding:"2px 8px",borderRadius:20,marginTop:4,display:"inline-block"}}>
                    ⚠️ كمية منخفضة
                  </span>
                )}
                {isEmpty&&(
                  <span style={{background:C.rL,color:C.red,fontSize:11,
                    fontWeight:700,padding:"2px 8px",borderRadius:20,marginTop:4,display:"inline-block"}}>
                    🚫 نفدت الكمية
                  </span>
                )}
              </div>

              {/* +/- controls */}
              <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
                <button onClick={()=>adjustQty(item.id,-1)}
                  style={{width:34,height:34,borderRadius:10,border:`1.5px solid ${C.bdr}`,
                    background:C.bg,cursor:"pointer",fontSize:18,fontWeight:700,
                    color:C.txt,display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>
                <button onClick={()=>adjustQty(item.id,+1)}
                  style={{width:34,height:34,borderRadius:10,border:`1.5px solid ${C.tM}`,
                    background:C.tL,cursor:"pointer",fontSize:18,fontWeight:700,
                    color:C.tM,display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
              </div>

              {/* Edit/Delete */}
              <div style={{display:"flex",gap:6,flexShrink:0}}>
                <button onClick={()=>setModal(item)}
                  style={{background:C.tL,border:"none",borderRadius:8,
                    padding:"7px 10px",cursor:"pointer",color:C.teal,fontSize:14}}>✏️</button>
                <button onClick={()=>deleteItem(item.id)}
                  style={{background:C.rL,border:"none",borderRadius:8,
                    padding:"7px 10px",cursor:"pointer",color:C.red,fontSize:14}}>🗑️</button>
              </div>
            </div>
          </div>
        );
      })}

      {modal&&(
        <InventoryModal
          item={modal==="add"?null:modal}
          onClose={()=>setModal(null)}
          onSave={f=>modal==="add"?addItem(f):editItem(modal.id,f)}/>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════
//  Palmer Tooth Chart (Adults - 32 teeth)
// ══════════════════════════════════════════════════════
function ToothChart({selected=[], onChange}){
  // Screen left-to-right order, matching standard Palmer chart printed layout:
  // Upper:  UR[8..1] | UL[1..8]
  // Lower:  LR[8..1] | LL[1..8]
  const quadrants = {
    UR: [8,7,6,5,4,3,2,1],
    UL: [1,2,3,4,5,6,7,8],
    LR: [8,7,6,5,4,3,2,1],
    LL: [1,2,3,4,5,6,7,8]
  };

  const toggle = (code) => {
    const exists = selected.includes(code);
    onChange(exists ? selected.filter(x=>x!==code) : [...selected, code]);
  };

  const Tooth = ({num, quad}) => {
    const code = quad + num;
    const sel = selected.includes(code);
    return (
      <button type="button" onClick={()=>toggle(code)}
        style={{
          width:26,height:34,flexShrink:0,
          border:`1.3px solid ${sel?C.tM:C.bdr}`,
          borderRadius:"5px 5px 7px 7px",
          background:sel?C.tM:C.card,
          color:sel?"#fff":C.mut,
          fontSize:11,fontWeight:700,cursor:"pointer",
          display:"flex",alignItems:"center",justifyContent:"center",
          transition:"all .12s",padding:0,
          boxShadow:sel?`0 2px 5px ${C.tM}55`:"none"}}>
        {num}
      </button>
    );
  };

  const rowStyle = {display:"flex",gap:2,alignItems:"center",flexShrink:0};
  const dividerV = <div style={{width:2,alignSelf:"stretch",background:C.tM,opacity:.4,
    margin:"0 4px",borderRadius:2,flexShrink:0}}/>;
  const quadW = 8*28+12;

  return (
    <div style={{marginBottom:14}}>
      <label style={{display:"block",fontSize:13,fontWeight:700,color:C.txt,marginBottom:8}}>
        🦷 مخطط الأسنان (بالمر)
      </label>
      <div style={{background:C.bg,borderRadius:14,padding:"12px 10px",
        border:`1px solid ${C.bdr}`,overflowX:"auto"}}>
        <div style={{minWidth:"fit-content",direction:"ltr"}}>
          {/* Labels */}
          <div style={{display:"flex",fontSize:9,color:C.mut,marginBottom:4,fontWeight:700}}>
            <div style={{width:quadW}}><span style={{display:"block",textAlign:"center"}}>UR</span></div>
            <div style={{width:8}}></div>
            <div style={{width:quadW}}><span style={{display:"block",textAlign:"center"}}>UL</span></div>
          </div>
          {/* Upper row */}
          <div style={{display:"flex",alignItems:"stretch"}}>
            <div style={rowStyle}>{quadrants.UR.map(n=><Tooth key={"UR"+n} num={n} quad="UR"/>)}</div>
            {dividerV}
            <div style={rowStyle}>{quadrants.UL.map(n=><Tooth key={"UL"+n} num={n} quad="UL"/>)}</div>
          </div>
          {/* Horizontal divider */}
          <div style={{height:2,background:C.tM,opacity:.4,margin:"5px 2px",borderRadius:2}}/>
          {/* Lower row */}
          <div style={{display:"flex",alignItems:"stretch"}}>
            <div style={rowStyle}>{quadrants.LR.map(n=><Tooth key={"LR"+n} num={n} quad="LR"/>)}</div>
            {dividerV}
            <div style={rowStyle}>{quadrants.LL.map(n=><Tooth key={"LL"+n} num={n} quad="LL"/>)}</div>
          </div>
          <div style={{display:"flex",fontSize:9,color:C.mut,marginTop:4,fontWeight:700}}>
            <div style={{width:quadW}}><span style={{display:"block",textAlign:"center"}}>LR</span></div>
            <div style={{width:8}}></div>
            <div style={{width:quadW}}><span style={{display:"block",textAlign:"center"}}>LL</span></div>
          </div>
        </div>
      </div>
      {selected.length>0&&(
        <div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:8}}>
          {selected.map(code=>{
            const q = code.slice(0,2);
            const n = code.slice(2);
            return <span key={code} style={{background:C.tL,color:C.tM,
              fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:14}}>
              {q}{n}
            </span>;
          })}
        </div>
      )}
    </div>
  );
}

      {vm&&<VisitModal visit={vm==="add"?null:vm} onClose={()=>setVm(null)}

  );
}

//  Settings Page

function SettingsPage({darkMode,onToggleDark,isDoctor,doctors,patients,onAddDoctor,onRemoveDoctor}){
  const [newDoc,setNewDoc]=useState("");
  const [finPeriod,setFinPeriod]=useState("month"); // month | year | all
  const [selDoc,setSelDoc]=useState(null); // doctor detail view
  const now=new Date();
  const thisMonth=now.toISOString().slice(0,7);
  const thisYear=String(now.getFullYear());

  const inPeriod = dateStr => {
    if(!dateStr) return false;
    if(finPeriod==="month") return dateStr.startsWith(thisMonth);
    if(finPeriod==="year")  return dateStr.startsWith(thisYear);
    return true;
  };

  // ═══ Overall financial totals ═══
  let finBill=0, finPaid=0, finVisits=0;
  patients.forEach(p=>(p.visits||[]).forEach(v=>{
    if(inPeriod(v.date)){
      finBill+=(+(v.total)||0);
      finPaid+=(+(v.paid)||0);
      finVisits++;
    }
  }));
  const finRem=Math.max(0,finBill-finPaid);

  // ═══ Per-doctor stats ═══
  const doctorStats=doctors.map(d=>{
    let total=0, monthly=0, pBill=0, pPaid=0, pCases=0;
    const treatCount={};
    patients.forEach(p=>(p.visits||[]).forEach(v=>{
      const inVisit=(v.doctors||[]).some(x=>x.id===d.id)||(v.doctorId===d.id);
      if(inVisit){
        total++;
        if((v.date||"").startsWith(thisMonth)) monthly++;
        if(inPeriod(v.date)){
          pCases++;
          pBill+=(+(v.total)||0);
          pPaid+=(+(v.paid)||0);
          (v.treatTypes||[]).forEach(t=>{treatCount[t]=(treatCount[t]||0)+1;});
        }
      }
    }));
    return {...d,total,monthly,pCases,pBill,pPaid,treatCount};
  });

  return(
    <div style={{padding:"0 0 40px"}}>

      {/* Dark Mode */}
      <div style={{background:C.card,borderRadius:16,boxShadow:C.sh,padding:20,marginBottom:16}}>
        <h3 style={{fontSize:15,fontWeight:800,color:C.txt,marginBottom:16}}>🎨 المظهر</h3>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <span style={{fontSize:14,color:C.txt,fontWeight:600}}>
            {darkMode?"🌙 الوضع الداكن":"☀️ الوضع الفاتح"}
          </span>
          <button onClick={onToggleDark}
            style={{width:52,height:28,borderRadius:14,border:"none",cursor:"pointer",
              background:darkMode?C.tM:"#cbd5e1",position:"relative",transition:"background .2s"}}>
            <div style={{width:22,height:22,borderRadius:"50%",background:"#fff",
              position:"absolute",top:3,transition:"left .2s",
              left:darkMode?27:3,boxShadow:"0 1px 4px rgba(0,0,0,.2)"}}/>
          </button>
        </div>
      </div>

      {/* Financial Reports — doctor only */}
      {isDoctor&&(
        <div style={{background:C.card,borderRadius:16,boxShadow:C.sh,padding:20,marginBottom:16}}>
          <h3 style={{fontSize:15,fontWeight:800,color:C.txt,marginBottom:14}}>💰 التقرير المالي</h3>

          {/* Period selector */}
          <div style={{display:"flex",gap:6,marginBottom:16}}>
            {[["month","هذا الشهر"],["year","هذه السنة"],["all","الكل"]].map(([k,lbl])=>(
              <button key={k} onClick={()=>setFinPeriod(k)}
                style={{flex:1,padding:"8px 4px",borderRadius:11,fontSize:12,fontWeight:700,
                  border:`1.5px solid ${finPeriod===k?C.tM:C.bdr}`,cursor:"pointer",
                  background:finPeriod===k?C.tM:C.card,
                  color:finPeriod===k?"#fff":C.mut,transition:"all .15s"}}>
                {lbl}
              </button>
            ))}
          </div>

          {/* Totals */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8,marginBottom:8}}>
            <div style={{background:C.tL,borderRadius:14,padding:"14px 12px",textAlign:"center"}}>
              <div style={{fontSize:11,color:C.tM,fontWeight:700,marginBottom:4}}>المدفوع (الدخل)</div>
              <div style={{fontSize:20,fontWeight:900,color:C.tM}}>{money(finPaid)}</div>
              <div style={{fontSize:10,color:C.tM,opacity:.7}}>د.ع</div>
            </div>
            <div style={{background:C.aL,borderRadius:14,padding:"14px 12px",textAlign:"center"}}>
              <div style={{fontSize:11,color:C.amb,fontWeight:700,marginBottom:4}}>الديون المتبقية</div>
              <div style={{fontSize:20,fontWeight:900,color:C.amb}}>{money(finRem)}</div>
              <div style={{fontSize:10,color:C.amb,opacity:.7}}>د.ع</div>
            </div>

              <div style={{fontSize:11,color:C.mut,fontWeight:700,marginBottom:3}}>الفواتير الإجمالية</div>
              <div style={{fontSize:17,fontWeight:900,color:C.txt}}>{money(finBill)} <span style={{fontSize:10,color:C.mut}}>د.ع</span></div>
            </div>
            <div style={{background:C.bg,borderRadius:14,padding:"12px",textAlign:"center"}}>
              <div style={{fontSize:11,color:C.mut,fontWeight:700,marginBottom:3}}>عدد الجلسات</div>
              <div style={{fontSize:17,fontWeight:900,color:C.txt}}>{finVisits}</div>
            </div>
          </div>
        </div>
      )}

      {/* Doctors — doctor only */}
      {isDoctor&&(
        <div style={{background:C.card,borderRadius:16,boxShadow:C.sh,padding:20}}>

                fontSize:14,color:C.txt,background:C.bg,outline:"none",fontFamily:"Cairo,sans-serif"}}
              onKeyDown={e=>{if(e.key==="Enter"&&newDoc.trim()){onAddDoctor(newDoc);setNewDoc("");}}}/>
            <Btn onClick={()=>{if(newDoc.trim()){onAddDoctor(newDoc);setNewDoc("");}}} sm>➕ إضافة</Btn>
          </div>

          {/* Doctors list */}
          {doctorStats.length===0?(
            <div style={{textAlign:"center",color:C.mut,padding:"20px 0",fontSize:14}}>
              لا يوجد أطباء مسجلين
            </div>
          ):(
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {doctorStats.map(d=>(
                <div key={d.id}>
                  <div onClick={()=>setSelDoc(selDoc===d.id?null:d.id)}
                    style={{display:"flex",alignItems:"center",gap:12,cursor:"pointer",
                    background:C.bg,borderRadius:selDoc===d.id?"12px 12px 0 0":12,padding:"12px 14px"}}>
                    <div style={{width:38,height:38,borderRadius:12,flexShrink:0,
                      background:`linear-gradient(135deg,${C.tM},${C.tD})`,
                      display:"flex",alignItems:"center",justifyContent:"center",
                      color:"#fff",fontWeight:900,fontSize:15}}>{d.name?.[0]}</div>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:800,fontSize:14,color:C.txt}}>{d.name}</div>
                      <div style={{fontSize:12,color:C.mut,marginTop:2}}>
                        {d.total} حالة إجمالي  •  {d.monthly} هذا الشهر

                    </div>
                    <span style={{fontSize:12,color:C.mut,transform:selDoc===d.id?"rotate(180deg)":"none",
                      transition:"transform .2s"}}>▼</span>

                      style={{background:"none",border:"none",cursor:"pointer",

                    <div style={{background:C.bg,borderRadius:"0 0 12px 12px",

                          <button key={k} onClick={()=>setFinPeriod(k)}
                            style={{flex:1,padding:"6px 4px",borderRadius:9,fontSize:11,fontWeight:700,
                              border:`1.5px solid ${finPeriod===k?C.tM:C.bdr}`,cursor:"pointer",
                              background:finPeriod===k?C.tM:C.card,
                              color:finPeriod===k?"#fff":C.mut}}>
                            {lbl}
                          </button>
                        ))}
                      </div>
                      {/* Financial row */}
                      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,marginBottom:10}}>
                        {[["حالات",d.pCases,""],["فواتير",money(d.pBill),"د.ع"],["مدفوع",money(d.pPaid),"د.ع"]].map(([l,v,u])=>(
                          <div key={l} style={{background:C.card,borderRadius:10,padding:"9px 4px",textAlign:"center"}}>

                      {Object.keys(d.treatCount).length>0?(
                        <div>
                          <div style={{fontSize:11,fontWeight:700,color:C.mut,marginBottom:6}}>أنواع العلاجات:</div>

// ══════════════════════════════════════════════════════
//  Main App
// ══════════════════════════════════════════════════════
function App(){
  const [authed,setAuthed]=useState(false);
  const [role,setRole]=useState(null); // "doctor" | "staff"
  const isDoctor = role==="doctor";
  const [darkMode,setDarkMode]=useState(()=>localStorage.getItem("dm")==="1");
  const [doctors,setDoctors]=useState([]);
  const [patients,setPatients]=useState([]);
  const [loading,setLoading]=useState(true);
  const [page,setPage]=useState("today");
  const [selId,setSelId]=useState(null);
  const [search,setSearch]=useState("");
  const [sortBy,setSortBy]     = useState("date"); // date | alpha | debt | bill
  const [filterDate,setFilterDate] = useState("");   // filter by visit date
  const [modal,setModal]=useState(null);

  // Update color scheme based on dark mode
  C=getC(darkMode);

  // useEffect MUST be before any conditional returns (React rules)
  useEffect(()=>{
    if(!authed||!READY)return;
    const unsub=db.collection("patients").orderBy("createdAt","desc").onSnapshot(snap=>{
      setPatients(snap.docs.map(d=>({id:d.id,...d.data()})));
      setLoading(false);
    },err=>{console.error(err);setLoading(false);});
    return unsub;
  },[authed]);

  useEffect(()=>{
    if(!authed||!READY)return;
    const unsub=db.collection("settings").doc("doctors").onSnapshot(snap=>{
      setDoctors(snap.exists?(snap.data().list||[]):[]);
    });
    return unsub;
  },[authed]);

  const saveDoctor=async name=>{
    const newDoc={id:uid(),name:name.trim()};
    await db.collection("settings").doc("doctors").set({list:[...doctors,newDoc]},{merge:true});
  };
  const removeDoctor=async id=>{
    await db.collection("settings").doc("doctors").set({list:doctors.filter(d=>d.id!==id)},{merge:true});
  };
  const toggleDark=()=>{
    const next=!darkMode;
    setDarkMode(next);
    localStorage.setItem("dm",next?"1":"0");
    document.body.style.background=getC(next).bg;
  };

  // Apply body bg on mount
  React.useEffect(()=>{
    document.body.style.background=getC(darkMode).bg;
  },[darkMode]);

  if(!READY)return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:C.bg,padding:20}}>
      <div style={{background:C.card,borderRadius:20,padding:32,maxWidth:400,textAlign:"center",boxShadow:C.sh}}>
        <div style={{fontSize:40,marginBottom:12}}>⚙️</div>
        <h2 style={{color:C.txt,marginBottom:12}}>يحتاج إعداد Firebase</h2>
        <p style={{color:C.mut,fontSize:14,lineHeight:1.7}}>افتح الملف وغيّر إعدادات Firebase في قسم الإعدادات بالأعلى.</p>
      </div>
    </div>
  );

  if(!authed)return <PinScreen onSuccess={r=>{setRole(r);setAuthed(true);}}/>;

  const col=()=>db.collection("patients");
  const addPatient=async f=>{await col().add({...f,visits:[],createdAt:new Date().toISOString()});setModal(null);};
  const editPatient=async(id,f)=>{await col().doc(id).update({name:f.name,age:f.age,phone:f.phone,gender:f.gender,notes:f.notes});setModal(null);};
  const deletePatient=async id=>{if(!confirm("حذف المريض؟"))return;await col().doc(id).delete();setPage("patients");setSelId(null);};
  const addVisit=async(pid,f)=>{const r=col().doc(pid);const d=await r.get();await r.update({visits:[...(d.data().visits||[]),{...f,id:uid()}]});};
  const editVisit=async(pid,vid,f)=>{const r=col().doc(pid);const d=await r.get();await r.update({visits:d.data().visits.map(v=>v.id===vid?{...v,...f}:v)});};
  const deleteVisit=async(pid,vid)=>{if(!confirm("حذف الزيارة؟"))return;const r=col().doc(pid);const d=await r.get();await r.update({visits:d.data().visits.filter(v=>v.id!==vid)});};


  const filtered = patients
    .filter(p=>p.name.includes(search)||(p.phone||"").includes(search))
    .filter(p=>!filterDate || (p.visits||[]).some(v=>v.date===filterDate))
    .slice()
    .sort((a,b)=>{
      if(sortBy==="alpha") return a.name.localeCompare(b.name,"ar");
      if(sortBy==="debt"){
        const da=(a.visits||[]).reduce((s,v)=>s+Math.max(0,(+(v.total)||0)-(+(v.paid)||0)),0);
        const db2=(b.visits||[]).reduce((s,v)=>s+Math.max(0,(+(v.total)||0)-(+(v.paid)||0)),0);
        return db2-da;
      }
      if(sortBy==="bill"){
        const ba=(a.visits||[]).reduce((s,v)=>s+(+(v.total)||0),0);
        const bb=(b.visits||[]).reduce((s,v)=>s+(+(v.total)||0),0);
        return bb-ba;
      }
      return new Date(b.createdAt)-new Date(a.createdAt); // date
    });
  const sel=patients.find(p=>p.id===selId);





  // ── Export to Excel ──────────────────────────────────
  const exportExcel = () => {
    const wb = window.XLSX.utils.book_new();
    const pRows = patients.map(p => {
      const tBill=(p.visits||[]).reduce((s,v)=>s+(+(v.total)||0),0);
      const tPaid=(p.visits||[]).reduce((s,v)=>s+(+(v.paid)||0),0);
      return {"الاسم":p.name,"العمر":p.age||"","الجنس":p.gender||"","الجوال":p.phone||"",
        "عدد الزيارات":(p.visits||[]).length,"اجمالي الفواتير":tBill,
        "المدفوع":tPaid,"المتبقي":Math.max(0,tBill-tPaid),"ملاحظات":p.notes||""};
    });
    const vRows=[];
    patients.forEach(p=>{
      (p.visits||[]).forEach(v=>{
        vRows.push({"اسم المريض":p.name,"الجوال":p.phone||"","تاريخ الزيارة":v.date||"",
          "نوع العلاج":(v.treatTypes||[]).join(" + ")||"","السن/التشخيص":v.diagnosis||"",
          "الاجمالي":+(v.total)||0,"المدفوع":+(v.paid)||0,
          "المتبقي":Math.max(0,(+(v.total)||0)-(+(v.paid)||0)),"ملاحظات":v.notes||""});
      });
    });
    const ws1=window.XLSX.utils.json_to_sheet(pRows.length?pRows:[{"":"لا توجد بيانات"}]);
    const ws2=window.XLSX.utils.json_to_sheet(vRows.length?vRows:[{"":"لا توجد زيارات"}]);
    window.XLSX.utils.book_append_sheet(wb,ws1,"المرضى");
    window.XLSX.utils.book_append_sheet(wb,ws2,"الزيارات");
    const d=new Date().toISOString().split("T")[0];
    window.XLSX.writeFile(wb,"نسخة_احتياطية_"+d+".xlsx");
  };

      {/* Content */}

        {page==="patients"&&(

              </div>
            </div>

                    background:sortBy===k?C.tM:C.bg,
                    color:sortBy===k?"#fff":C.mut,cursor:"pointer",transition:"all .15s"}}>

                </button>
              ))}
            </div>
            <input value={search} onChange={e=>setSearch(e.target.value)}

              onFocus={e=>e.target.style.borderColor=C.tM}
              onBlur={e=>e.target.style.borderColor=C.bdr}/>
            {/* Date filter */}
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
              <div style={{position:"relative",flex:1}}>
                <input type="date" value={filterDate} onChange={e=>setFilterDate(e.target.value)}

                    border:`1.5px solid ${filterDate?C.tM:C.bdr}`,
                    fontSize:13,background:C.card,outline:"none",
                    color:filterDate?C.tM:C.mut}}/>

              </div>

              const rem=(p.visits||[]).reduce((s,v)=>s+Math.max(0,(+(v.total)||0)-(+(v.paid)||0)),0);

                <div key={p.id} onClick={()=>{setSelId(p.id);setPage("patient");}}

                  onMouseLeave={e=>e.currentTarget.style.transform="none"}>
                  <div style={{width:44,height:44,borderRadius:"50%",background:C.tL,

                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:800,fontSize:16,color:C.txt,lineHeight:1.2}}>{p.name}</div>
                    <div style={{fontSize:12,color:C.mut,marginTop:2}}>
                      {p.age&&`${p.age} سنة`}{p.phone&&` • ${p.phone}`}
                    </div>
                    {last&&<div style={{fontSize:11,color:C.mut,marginTop:2}}>آخر زيارة: {fmtDateShort(last.date)}</div>}
                  </div>
                  <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4,flexShrink:0}}>
                    <span style={{background:C.tL,color:C.tM,fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:20}}>
                      {p.visits?.length||0} زيارة
                    </span>
                    {rem>0&&isDoctor&&<span style={{background:C.aL,color:C.amb,fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:20}}>
                      {money(rem)} د.ع
                    </span>}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {page==="patient"&&sel&&(
          <PatientDetail patient={sel}
            onBack={()=>{setPage("patients");setSelId(null);}}
            onEdit={()=>setModal(sel)}
            onDelete={()=>deletePatient(sel.id)}
            onAddVisit={addVisit} onEditVisit={editVisit} onDeleteVisit={deleteVisit}
            isDoctor={isDoctor} doctors={doctors}/>
        )}
      </div>

      {modal&&<PatientModal patient={modal==="add"?null:modal} onClose={()=>setModal(null)}
        onSave={f=>modal==="add"?addPatient(f):editPatient(modal.id,f)}/>}

      {/* Bottom Nav */}
      <div style={{position:"fixed",bottom:"calc(10px + env(safe-area-inset-bottom,0px))",
        left:10,right:10,zIndex:50,maxWidth:760,margin:"0 auto",
        background:C.card,
        display:"flex",
        borderRadius:24,
        padding:"7px 6px",
        boxShadow:"0 10px 36px rgba(23,33,43,.18), 0 2px 8px rgba(23,33,43,.08)",
        border:`1px solid ${C.bdr}`}}>
        {[["today","📋","اليوم"],["appointments","📅","مواعيد"],["patients","👥","أرشيف"],["inventory","📦","مخزن"],["settings","⚙️","إعدادات"]].map(([id,ico,lbl])=>{
          const active=page===id||(page==="patient"&&id==="patients");
          return(
            <button key={id} onClick={()=>{setPage(id);setSelId(null);}}
              style={{flex:1,padding:"8px 2px",border:"none",cursor:"pointer",
                display:"flex",flexDirection:"column",alignItems:"center",gap:3,
                fontFamily:"Cairo,sans-serif",
                background:active?C.tL:"none",
                borderRadius:16,
                transition:"background .2s"}}>
              <span style={{fontSize:20,lineHeight:1,
                filter:active?"none":"grayscale(.9) opacity(.55)"}}>{ico}</span>
              <span style={{fontSize:10,fontWeight:active?800:600,
                color:active?C.tM:C.mut}}>{lbl}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('/sw.js');
    });
  }
</script>
</body>
</html>
